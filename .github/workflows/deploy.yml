name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # 默认构建 (懒加载/代码分割) 部署到站点根目录
            - run: npm run build
              env:
                  BASE_URL: /${{ github.event.repository.name }}/
            # 兼容构建 (单包, 无动态 import) 部署到 /compat/ 子目录
            - run: npm run build:compat
              env:
                  BASE_URL: /${{ github.event.repository.name }}/compat/
            - run: |
                  mkdir -p dist/compat
                  cp -r dist-compat/. dist/compat/
            # 独立导出内核: 项目代码内嵌，第三方库由导出的 HTML 从 CDN 加载。
            - run: npm run build:standalone
            - run: |
                  mkdir -p dist/standalone
                  cp -r dist-standalone/. dist/standalone/
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist
            - id: deployment
              uses: actions/deploy-pages@v5
